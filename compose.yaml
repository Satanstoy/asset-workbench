services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: asset_workbench
      MYSQL_USER: workbench
      MYSQL_PASSWORD: ${DB_PASSWORD:-workbench-local}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root-local}
    healthcheck:
      test:
        - CMD-SHELL
        - mysql --protocol=TCP -h 127.0.0.1 -u "$${MYSQL_USER}" -p"$${MYSQL_PASSWORD}" "$${MYSQL_DATABASE}" -e 'SELECT 1'
      interval: 5s
      timeout: 4s
      retries: 20
    volumes:
      - mysql-data:/var/lib/mysql
  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:mysql://db:3306/asset_workbench
      DB_USER: workbench
      DB_PASSWORD: ${DB_PASSWORD:-workbench-local}
      ASSETS_DIRECTORY: /app/data/assets
      SIMULATION_ENABLED: ${SIMULATION_ENABLED:-true}
    volumes:
      - assets-data:/app/data/assets
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
volumes:
  mysql-data:
  assets-data:
