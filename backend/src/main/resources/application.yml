spring:
  application:
    name: asset-workbench
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/asset_workbench}
    username: ${DB_USER:workbench}
    password: ${DB_PASSWORD:workbench-local}
  sql:
    init:
      mode: always
      encoding: UTF-8
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jackson:
    mapper:
      allow-coercion-of-scalars: false
    deserialization:
      accept-float-as-int: false
      fail-on-numbers-for-enums: true
      fail-on-unknown-properties: true
server:
  tomcat:
    max-swallow-size: 6MB
workbench:
  assets-directory: ${ASSETS_DIRECTORY:./data/assets}
  simulation-enabled: ${SIMULATION_ENABLED:false}
management:
  endpoints:
    web:
      base-path: /api
      exposure:
        include: health
